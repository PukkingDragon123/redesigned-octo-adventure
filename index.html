<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2a1a24" />
    <title>Deli-very-dead</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='4' y='5' width='7' height='8' fill='%23e8dcc8'/%3E%3Crect x='11' y='7' width='2' height='4' fill='%23e8dcc8'/%3E%3Crect x='5' y='6' width='5' height='2' fill='%236b3a22'/%3E%3Crect x='5' y='2' width='1' height='2' fill='%23ffffff' opacity='.6'/%3E%3Crect x='8' y='1' width='1' height='3' fill='%23ffffff' opacity='.6'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
    </div>
    <div id="ui"></div>
    <div id="boot">
      <style>
        @font-face { font-family: 'BoldPixelsBoot'; src: url('./fonts/boldpixels.woff2') format('woff2'); }
        @font-face { font-family: 'MonogramBoot'; src: url('./fonts/monogram-extended.ttf') format('truetype'); }
        #boot { position: fixed; inset: 0; z-index: 100; overflow: hidden; background: #2a1a2a; transition: opacity 0.8s; font-family: 'MonogramBoot', monospace; }
        #boot.gone { opacity: 0; pointer-events: none; }
        .bs-sky { position: absolute; inset: 0; background: linear-gradient(180deg, #3a2448 0%, #8a3a4a 45%, #e8763a 70%, #f2b24a 78%); }
        .bs-moon { position: absolute; right: 14%; top: 12%; width: 64px; height: 64px; border-radius: 50%; background: #fff2c8; box-shadow: 0 0 0 10px rgba(255, 240, 200, 0.12), 0 0 0 24px rgba(255, 240, 200, 0.06); }
        .bs-band { position: absolute; left: 0; width: 400%; background-repeat: repeat-x; image-rendering: pixelated; will-change: transform; }
        .bs-far { bottom: 42%; height: 120px; animation: bscroll 9s linear infinite; }
        .bs-near { bottom: 30%; height: 140px; animation: bscroll 3.2s linear infinite; }
        .bs-road { bottom: 0; height: 31%; background: #4a2a22; width: 400%; animation: bscroll 1.1s linear infinite; }
        @keyframes bscroll { to { transform: translateX(-25%); } }
        .bs-runner { position: absolute; left: 50%; bottom: 25%; width: 192px; height: 240px; margin-left: -96px; overflow: hidden; animation: bsbob 0.18s ease-in-out infinite alternate; will-change: transform; }
        .bs-runner canvas { width: 1152px; height: 240px; image-rendering: pixelated; animation: bsrun 0.48s steps(6) infinite; will-change: transform; }
        @keyframes bsrun { to { transform: translateX(-1152px); } }
        @keyframes bsbob { from { transform: translateY(0) rotate(-4deg); } to { transform: translateY(-14px) rotate(-7deg); } }
        .bs-lines { position: absolute; left: 0; right: 0; bottom: 20%; height: 260px; }
        .bs-lines i { position: absolute; height: 6px; background: #fff6e0; opacity: 0.85; animation: bsline 0.5s linear infinite; will-change: transform; }
        @keyframes bsline { from { transform: translateX(60vw) scaleX(0.4); opacity: 0; } 30% { opacity: 0.9; } to { transform: translateX(-60vw) scaleX(1.4); opacity: 0; } }
        .bs-dust { position: absolute; left: calc(50% - 150px); bottom: 25%; }
        .bs-dust i { position: absolute; width: 28px; height: 28px; background: #e8c8a0; border-radius: 50%; animation: bsdust 0.6s ease-out infinite; will-change: transform; }
        @keyframes bsdust { from { transform: translate(0, 0) scale(0.6); opacity: 0.9; } to { transform: translate(-140px, -40px) scale(1.8); opacity: 0; } }
        .bs-hurry { position: absolute; left: 50%; top: 14%; transform: translateX(-50%) rotate(-6deg); display: flex; gap: 4px; font-family: 'BoldPixelsBoot', monospace; font-size: 96px; line-height: 1; }
        .bs-hurry span { display: inline-block; color: #fff6e0; text-shadow: 6px 6px 0 #c8361f, 12px 12px 0 #2a1a2a; animation: bshur 0.32s ease-in-out infinite alternate; will-change: transform; }
        .bs-hurry span:nth-child(2n) { animation-delay: -0.16s; color: #ffd060; }
        @keyframes bshur { from { transform: translateY(0) rotate(-8deg) scale(1); } to { transform: translateY(-18px) rotate(8deg) scale(1.15); } }
        .bs-burst { position: absolute; left: 50%; top: 14%; width: 620px; height: 200px; margin-left: -310px; margin-top: -40px; background: #2a1a2a; clip-path: polygon(50% 0, 56% 30%, 70% 4%, 66% 34%, 88% 14%, 76% 42%, 100% 40%, 78% 56%, 96% 76%, 72% 66%, 74% 96%, 60% 72%, 50% 100%, 42% 72%, 26% 96%, 30% 66%, 4% 78%, 24% 56%, 0 40%, 24% 42%, 12% 14%, 34% 34%, 30% 4%, 44% 30%); animation: bsburst 0.24s steps(2) infinite; opacity: 0.85; }
        @keyframes bsburst { to { transform: rotate(4deg) scale(1.05); } }
        .bs-sweat { position: absolute; left: calc(50% + 60px); bottom: calc(25% + 200px); }
        .bs-sweat i { position: absolute; width: 14px; height: 20px; background: #8ad0ff; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; animation: bssweat 0.7s ease-out infinite; will-change: transform; }
        @keyframes bssweat { from { transform: translate(0, 0); opacity: 1; } to { transform: translate(70px, 50px); opacity: 0; } }
        .bs-ui { position: absolute; left: 0; right: 0; bottom: 4%; text-align: center; }
        .boot-title { font-family: 'BoldPixelsBoot', monospace; font-size: 40px; color: #fff6e0; text-shadow: 4px 4px 0 #2a1a2a; letter-spacing: 2px; }
        .boot-sub { margin-top: 6px; font-size: 24px; color: #f2d8b0; }
        .boot-bar { margin: 10px auto 0; width: min(420px, 80vw); height: 20px; background: #2a1a2a; padding: 4px; transform: rotate(-1deg); }
        .boot-fill { height: 100%; width: 0%; background: repeating-linear-gradient(90deg, #e8701e 0 12px, #ffd060 12px 24px); transition: width 0.2s; }
        @media (max-width: 700px) { .bs-hurry { font-size: 64px; } .bs-burst { width: 420px; margin-left: -210px; height: 150px; } }
      </style>
      <div class="bs-sky"></div><div class="bs-moon"></div>
      <div class="bs-band bs-far" id="bsFar"></div>
      <div class="bs-band bs-near" id="bsNear"></div>
      <div class="bs-band bs-road" id="bsRoad"></div>
      <div class="bs-lines"><i style="top:20%;width:180px;animation-delay:-0.1s"></i><i style="top:45%;width:260px;animation-delay:-0.3s"></i><i style="top:70%;width:140px;animation-delay:-0.2s"></i><i style="top:88%;width:220px;animation-delay:-0.4s"></i></div>
      <div class="bs-dust"><i style="animation-delay:0s"></i><i style="animation-delay:-0.2s"></i><i style="animation-delay:-0.4s"></i></div>
      <div class="bs-runner"><canvas id="bootSprite" width="192" height="40"></canvas></div>
      <div class="bs-sweat"><i></i><i style="animation-delay:-0.35s;left:12px"></i></div>
      <div class="bs-burst"></div>
      <div class="bs-hurry"><span>H</span><span>U</span><span>R</span><span>R</span><span>Y</span><span>!</span></div>
      <div class="bs-ui">
        <div class="boot-title">DELI-VERY-DEAD</div>
        <div class="boot-sub">the cocoa is getting cold...</div>
        <div class="boot-bar"><div class="boot-fill" id="bootFill"></div></div>
      </div>
      <script>
        // pixel art drawn before any module loads: Hank sprinting with a cocoa
        (function () {
          var c = document.getElementById('bootSprite'), g = c.getContext('2d');
          function R(x, y, w, h, col) { g.fillStyle = col; g.fillRect(x, y, w, h); }
          var BONE = '#ecdcbc', SH = '#b8a888', INK = '#2a1a22', RED = '#c8361f', CREAM = '#f2e6cc';
          var legs = [[[-5, 3], [4, -2]], [[-2, 1], [2, 0]], [[3, -2], [-5, 3]], [[4, -2], [-5, 2]], [[1, 0], [-2, 1]], [[-5, 3], [3, -2]]];
          for (var f = 0; f < 6; f++) {
            var ox = f * 32 + 16, by = (f % 3 === 1) ? 1 : 0;
            // scarf streaming back
            var wv = Math.sin(f * 1.05) * 2;
            R(ox - 2, 15 - by, 3, 3, RED); R(ox - 9, 14 - by + wv * 0.5, 7, 2, RED); R(ox - 15, 13 - by + wv, 6, 2, CREAM); R(ox - 18, 12 - by + wv, 3, 2, RED);
            // legs
            var L = legs[f];
            for (var k = 0; k < 2; k++) {
              var fx = L[k][0], fy = L[k][1];
              var col = k ? SH : BONE;
              R(ox - 1 + Math.round(fx * 0.5), 27 - by, 2, 6, col);
              R(ox - 1 + fx, 32 - by + Math.min(0, fy), 2, 5 + Math.max(0, -fy) * 0, col);
              R(ox - 2 + fx, 37 - by + Math.min(0, fy), 5, 2, col);
            }
            // pelvis, spine and ribs
            R(ox - 3, 25 - by, 7, 3, BONE);
            R(ox, 16 - by, 2, 10, SH);
            for (var r = 0; r < 3; r++) R(ox - 3, 18 + r * 2 - by, 8, 1, BONE);
            // arms pumping
            var a = Math.sin((f / 6) * Math.PI * 2) * 4;
            R(ox + 3, 18 - by, 2, 4, BONE); R(ox + 4 + Math.round(a * 0.6), 21 - by - Math.round(a * 0.4), 2, 4, BONE);
            R(ox - 4, 18 - by, 2, 4, SH); R(ox - 5 - Math.round(a * 0.6), 21 - by + Math.round(a * 0.4), 2, 4, SH);
            // cocoa cup held out front, steam
            var cx = ox + 6 + Math.round(a * 0.6), cy = 22 - by - Math.round(a * 0.4);
            R(cx, cy, 4, 4, '#f6f0e6'); R(cx + 4, cy + 1, 1, 2, '#f6f0e6'); R(cx, cy, 4, 1, '#6a3a1e');
            R(cx + 1, cy - 3 - (f % 2), 1, 2, '#ffffff'); R(cx + 2, cy - 5 + (f % 2), 1, 2, '#ffffff');
            // big skull with a red toque and glowing eyes
            R(ox - 5, 4 - by, 11, 10, BONE); R(ox - 4, 3 - by, 9, 1, BONE); R(ox - 4, 14 - by, 9, 1, SH);
            R(ox - 3, 7 - by, 3, 3, INK); R(ox + 2, 7 - by, 3, 3, INK); R(ox - 2, 8 - by, 1, 1, '#ffd060'); R(ox + 3, 8 - by, 1, 1, '#ffd060');
            R(ox, 11 - by, 1, 1, INK); R(ox - 3, 13 - by, 7, 1, INK); for (var t = 0; t < 4; t++) R(ox - 3 + t * 2, 13 - by, 1, 1, '#fffaf0');
            R(ox - 6, 1 - by, 13, 3, RED); R(ox - 6, 3 - by, 13, 1, CREAM); R(ox - 9 - (f % 2), 0 - by, 4, 3, RED); R(ox - 11 - (f % 2), -1 - by + 1, 3, 3, '#fffaf0');
            // sweat drop flying off
            R(ox + 7, 3 - by - (f % 3), 2, 2, '#8ad0ff');
          }
          // scrolling scenery strips (repeat-x backgrounds)
          function strip(id, w, h, draw) {
            var s = document.createElement('canvas'); s.width = w; s.height = h;
            var q = s.getContext('2d'); draw(q, w, h);
            var e = document.getElementById(id); e.style.backgroundImage = 'url(' + s.toDataURL() + ')'; e.style.backgroundSize = (w * 4) + 'px ' + (h * 4) + 'px';
          }
          strip('bsFar', 80, 30, function (q, w, h) { q.fillStyle = '#5a2a44'; for (var x = 0; x < w; x++) { var y = 12 + Math.round(Math.sin(x * 0.17) * 4 + Math.sin(x * 0.07) * 4); q.fillRect(x, y, 1, h - y); } });
          strip('bsNear', 64, 35, function (q, w, h) {
            q.fillStyle = '#3a1a2a'; q.fillRect(0, 28, w, 7);
            var cols = ['#c8361f', '#e8701e', '#f2b24a'];
            for (var t = 0; t < 3; t++) { var tx = 8 + t * 21; q.fillStyle = '#2a1414'; q.fillRect(tx + 3, 18, 2, 10); q.fillStyle = cols[t]; q.fillRect(tx, 8, 8, 11); q.fillRect(tx + 1, 6, 6, 2); q.fillRect(tx - 1, 11, 10, 5); }
            q.fillStyle = '#e8701e'; q.fillRect(30, 25, 5, 4); q.fillStyle = '#2a1414'; q.fillRect(31, 26, 1, 1); q.fillRect(33, 26, 1, 1); q.fillStyle = '#ffd060'; q.fillRect(31, 27, 3, 1);
          });
          strip('bsRoad', 48, 20, function (q, w, h) { q.fillStyle = '#4a2a22'; q.fillRect(0, 0, w, h); q.fillStyle = '#6a3a2a'; q.fillRect(0, 0, w, 2); q.fillStyle = '#e8c8a0'; q.fillRect(4, 8, 14, 2); q.fillStyle = '#5a3228'; q.fillRect(30, 14, 3, 2); q.fillRect(40, 5, 2, 1); });
          var tips = ['the cocoa is getting cold...', 'reattaching femurs...', 'carving pumpkins...', 'teaching bats to fly...', 'polishing skulls...', 'warming the marshmallows...'];
          var i = 0, sub = document.querySelector('.boot-sub');
          window.__bootTips = setInterval(function () { i = (i + 1) % tips.length; sub.textContent = tips[i]; }, 1400);
        })();
      </script>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
