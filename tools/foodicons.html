<!doctype html>
<html><head><meta charset="utf-8"><title>Food icons</title>
<style>
html,body{margin:0;min-height:100%;background:#f3e7cf;font:11px/1.2 monospace;color:#5a3e2e}
body{background-image:radial-gradient(#e9dabb 1px,transparent 1px);background-size:6px 6px}
#grid{display:grid;gap:3px;padding:4px}
.cell{position:relative;box-sizing:border-box;background:rgba(255,250,238,.55);border:1px solid #e2cfa8;border-radius:6px;padding:2px 0 3px;display:flex;flex-direction:column;align-items:center}
.row{display:flex;align-items:flex-end;gap:2px}
canvas{image-rendering:pixelated;display:block}
.lbl{margin-top:3px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.kind{font-size:10px;opacity:.6}
b{color:#a0522d}
</style></head><body><div id="grid"></div><script type="module" src="./foodicons.js"></script></body></html>
