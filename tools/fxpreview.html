<!doctype html>
<html><head><meta charset="utf-8"><title>FX atlas preview</title>
<style>html,body{margin:0;background:#6a7a8a;color:#fff;font:12px monospace}canvas{display:block;image-rendering:pixelated}</style>
</head><body><canvas id="c"></canvas><script type="module">
// The particle atlas (32px cells) at ?scale=N; tinted toon smoke rows below it.
import { paintAtlas, CELLS } from '../src/render/particles.js';
const q = new URLSearchParams(location.search);
const s = +(q.get('scale') || 2);
const pix = paintAtlas();
const src = pix.toCanvas();
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const rows = 11;
cv.width = 512 * s; cv.height = (rows * 32 + 140) * s;
ctx.imageSmoothingEnabled = false;
ctx.drawImage(src, 0, 0, 512, rows * 32, 0, 0, 512 * s, rows * 32 * s);
// tinted toon frames as they'd look on a warm dust colour and a purple reaper colour
const tints = ['#d8c4a0', '#5a4a6a', '#a8e0a0'];
tints.forEach((t, k) => {
  for (let f = 0; f < 8; f++) {
    const c = CELLS.toon + f;
    const sx = (c % 16) * 32, sy = Math.floor(c / 16) * 32;
    const x = f * 36 * s, y = (rows * 32 + 4 + k * 44) * s;
    const tmp = document.createElement('canvas');
    tmp.width = tmp.height = 32;
    const tc = tmp.getContext('2d');
    tc.drawImage(src, sx, sy, 32, 32, 0, 0, 32, 32);
    tc.globalCompositeOperation = 'multiply';
    tc.fillStyle = t;
    tc.fillRect(0, 0, 32, 32);
    tc.globalCompositeOperation = 'destination-in';
    tc.drawImage(src, sx, sy, 32, 32, 0, 0, 32, 32);
    ctx.drawImage(tmp, x, y, 32 * s, 32 * s);
  }
});
window.__done = true;
</script></body></html>
